name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  Backend_Validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-php
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
      - name: Discover Composer download cache directory
        id: composer-cache
        shell: bash
        run: |
          cache_dir="$(composer config cache-files-dir)"
          printf 'dir=%s\n' "$cache_dir" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-downloads-${{ runner.os }}-${{ hashFiles('backend-php/composer.lock') }}
      - name: Install Composer dependencies
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: composer install
      - name: Run Feature test suite
        if: ${{ !cancelled() }}
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --testsuite=Feature
  Frontend_Validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js 22.12.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
      - name: Discover npm download cache directory
        id: npm-cache
        shell: bash
        run: |
          cache_dir="$(npm config get cache)"
          printf 'dir=%s\n' "$cache_dir" >> "$GITHUB_OUTPUT"
      - name: Cache npm downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-downloads-${{ runner.os }}-${{ hashFiles('frontend-react/package-lock.json') }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
